<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3Sus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>⚡ 3Sus</h1>
      <span class="badge">v1.0</span>
    </header>

    <!-- Toggles -->
    <section class="toggles">
      <div class="row">
        <label for="autoSuspend">Auto-suspend tabs (5 min)</label>
        <input type="checkbox" id="autoSuspend" class="switch" />
      </div>
      <div class="row">
        <label for="blockTrackers">Block trackers &amp; ads</label>
        <input type="checkbox" id="blockTrackers" class="switch" />
      </div>
      <div class="row">
        <label for="blockMedia">Block autoplay media</label>
        <input type="checkbox" id="blockMedia" class="switch" />
      </div>
      <div class="row">
        <label for="domCleaner">Clean DOM/animations (this tab)</label>
        <input type="checkbox" id="domCleaner" class="switch" />
      </div>
    </section>

    <!-- Whitelist -->
  <section class="whitelist">
    <div class="wl-row">
      <span id="wlDomain" class="wl-domain">—</span>
      <button id="wlToggle" class="wl-btn">Whitelist</button>
    </div>
  </section>

  <!-- Stats -->
    <section class="stats">
      <div class="stat">
        <span id="ramSaved" class="stat-num">0</span>
        <span class="stat-label">MB RAM saved</span>
      </div>
      <div class="stat">
        <span id="tabsSuspended" class="stat-num">0</span>
        <span class="stat-label">Tabs suspended</span>
      </div>
    </section>

    <div class="btn-group">
    <button id="suspendAll" class="primary">Suspend All Other Tabs Now</button>
    <button id="restoreAll" class="secondary">Restore All Tabs</button>
  </div>

    <footer id="status"></footer>

    <script src="popup.js"></script>
  </body>
</html>
